# PAID real LLM repair test: manual RUN only; never run on push/PR.
name: SWE Real LLM Repair E2E

on:
  workflow_dispatch:
    inputs:
      authorization:
        description: "Type RUN to authorize external model repair test"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: aswe-live-repair-once
  cancel-in-progress: false

jobs:
  real-repair:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.authorization == 'RUN' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: bytedance/deer-flow
          ref: c0895d295bba34f6e95188fca380f555dabed891
          path: vendor/deer-flow
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Verify pinned source and install vendor dependencies
        run: |
          test "$(git -C vendor/deer-flow rev-parse HEAD)" = "c0895d295bba34f6e95188fca380f555dabed891"
          test -z "$(git -C vendor/deer-flow status --porcelain --untracked-files=no)"
          uv pip install --system -e '.[dev]' -e vendor/deer-flow/backend/packages/harness
      - name: Prepare pinned Python Docker image
        run: |
          docker pull python:3.12-slim
          docker image inspect python:3.12-slim --format '{{index .RepoDigests 0}}'
      - name: Real LLM Planner Explorer Coder failed Tester Repair retest
        timeout-minutes: 23
        env:
          ASWE_LIVE_SMOKE: '1'
          ASWE_LIVE_REPAIR_ONCE: '1'
          PYTHONPATH: 'src:.'
          LLM_API_KEY: ${{ secrets.SWE_LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.SWE_LLM_MODEL }}
          LLM_BASE_URL: ${{ secrets.SWE_LLM_BASE_URL }}
          LANGCHAIN_TRACING_V2: 'false'
          LANGSMITH_TRACING: 'false'
          ASWE_LIVE_REPAIR_REPORT_PATH: ${{ runner.temp }}/real-repair-result.json
        run: |
          python scripts/live_repair_acceptance.py
      - name: Upload redacted real LLM repair result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aswe-real-llm-repair-result
          path: ${{ runner.temp }}/real-repair-result.json
          retention-days: 7
          if-no-files-found: ignore
