# Paid single-use natural 565 E4 diagnostic. REMOVE immediately after run.
name: Step 7D-E4 Temporary Natural 565 Diagnosis
on:
  push:
    branches: [coding/step7de4-semantic-terminal-diagnosis]
    paths: [.github/workflows/swe-step7de4-temporary.yml]
permissions:
  contents: read
jobs:
  natural-565:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: aswe-step7de4-single-natural-565
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: bytedance/deer-flow
          ref: c0895d295bba34f6e95188fca380f555dabed891
          path: vendor/deer-flow
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Check pins and install frozen dependencies
        run: |
          test "$(git -C vendor/deer-flow rev-parse HEAD)" = c0895d295bba34f6e95188fca380f555dabed891
          uv pip install --system -e '.[dev]' -e vendor/deer-flow/backend/packages/harness
          python -m compileall -q scripts/step7d_real_issue_eval.py
      - name: Prepare isolated Docker
        run: |
          docker pull python:3.12-slim
          docker image inspect python:3.12-slim --format '{{index .RepoDigests 0}}'
      - name: Genuine LLM natural full-spec 565 unchanged acceptance
        timeout-minutes: 23
        env:
          GITHUB_ACTIONS: 'true'
          ASWE_LIVE_SMOKE: '1'
          ASWE_STEP7D_EVAL_ONCE: '1'
          ASWE_EVAL_CASE: '565'
          PYTHONPATH: 'src:.'
          LLM_API_KEY: ${{ secrets.SWE_LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.SWE_LLM_MODEL }}
          LLM_BASE_URL: ${{ secrets.SWE_LLM_BASE_URL }}
          LANGCHAIN_TRACING_V2: 'false'
          LANGSMITH_TRACING: 'false'
          ASWE_STEP7D_EVAL_REPORT_PATH: ${{ runner.temp }}/e4-natural-565.json
        run: python scripts/step7d_real_issue_eval.py
      - name: Preserve diagnostic evidence on both success and failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step7de4-natural-565-redacted-evidence
          path: ${{ runner.temp }}/e4-natural-565.json
          retention-days: 7
          if-no-files-found: warn
