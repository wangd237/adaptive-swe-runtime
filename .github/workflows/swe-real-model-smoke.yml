# 5F-D: explicitly PAID external model smoke. Never executes on push or PR.
# GitHub registers workflow_dispatch only once this workflow file exists
# on the repository default branch; keep PR #7 Draft until reviewed.
name: SWE Real Model Smoke (Manual)

on:
  workflow_dispatch:
    inputs:
      authorization:
        description: "Type RUN to authorize one real API-funded SWE smoke"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: swe-live-manual-${{ github.ref }}
  cancel-in-progress: false

jobs:
  real-model-swe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Confirm intentional paid model invocation
        env:
          ACK: ${{ inputs.authorization }}
        run: |
          if [ "$ACK" != "RUN" ]; then
            echo "::error::Explicit confirmation RUN is required."
            exit 1
          fi
      - name: Checkout A-SWE
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout frozen DeerFlow
        uses: actions/checkout@v4
        with:
          repository: bytedance/deer-flow
          ref: c0895d295bba34f6e95188fca380f555dabed891
          path: vendor/deer-flow
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Verify exact frozen source
        run: |
          test "$(git -C vendor/deer-flow rev-parse HEAD)" = "c0895d295bba34f6e95188fca380f555dabed891"
          test -z "$(git -C vendor/deer-flow status --porcelain --untracked-files=no)"
      - name: Install Runtime and vendor Harness
        run: |
          uv pip install --system -e '.[dev]' -e vendor/deer-flow/backend/packages/harness
      - name: Pull no-network SWE Python image
        run: |
          docker pull python:3.12-slim
          docker image inspect python:3.12-slim --format '{{index .RepoDigests 0}}'
      - name: Validate required secrets without printing their values
        env:
          ASWE_LIVE_SMOKE: '1'
          SWE_LLM_API_KEY: ${{ secrets.SWE_LLM_API_KEY }}
          SWE_LLM_MODEL: ${{ secrets.SWE_LLM_MODEL }}
          SWE_LLM_BASE_URL: ${{ secrets.SWE_LLM_BASE_URL }}
        run: |
          python - <<'PY'
          from aswe.integrations.deerflow.live_smoke_config import LiveModelSettings
          LiveModelSettings.from_environment()
          print("LIVE_CONFIGURATION_VALID")
          PY
      - name: One real LLM autonomous repair and canonical verification
        timeout-minutes: 12
        env:
          ASWE_LIVE_SMOKE: '1'
          PYTHONPATH: src
          SWE_LLM_API_KEY: ${{ secrets.SWE_LLM_API_KEY }}
          SWE_LLM_BASE_URL: ${{ secrets.SWE_LLM_BASE_URL }}
          SWE_LLM_MODEL: ${{ secrets.SWE_LLM_MODEL }}
          OPENAI_API_KEY: ${{ secrets.SWE_LLM_API_KEY }}
          ASWE_LIVE_REPORT_PATH: ${{ runner.temp }}/aswe-live-report.json
          LANGCHAIN_TRACING_V2: 'false'
          LANGSMITH_TRACING: 'false'
        run: |
          python -m pytest -q -x --tb=short -s tests/integration/test_deerflow_live_swe_step5fd.py
      - name: Upload redacted MVP report (if produced)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swe-live-mvp-report
          path: ${{ runner.temp }}/aswe-live-report.json
          retention-days: 7
          if-no-files-found: ignore
