# Explicitly paid LLM acceptance. The one-shot push gate below is restricted
# to a single acceptance branch and a unique commit marker. Remove after run.
name: SWE Adaptive Real LLM E2E

on:
  workflow_dispatch:
    inputs:
      authorization:
        description: "Type RUN to authorize paid Adaptive Planner/Explorer/Coder E2E"
        required: true
        type: string
  push:
    branches: ['coding/live-adaptive-acceptance']

permissions:
  contents: read

concurrency:
  group: adaptive-live-once
  cancel-in-progress: false

jobs:
  adaptive-real-llm:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.authorization == 'RUN') ||
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/coding/live-adaptive-acceptance' &&
       contains(github.event.head_commit.message, '[run-live-adaptive]'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: bytedance/deer-flow
          ref: c0895d295bba34f6e95188fca380f555dabed891
          path: vendor/deer-flow
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Verify source pin and install frozen native runtime
        run: |
          test "$(git -C vendor/deer-flow rev-parse HEAD)" = "c0895d295bba34f6e95188fca380f555dabed891"
          test -z "$(git -C vendor/deer-flow status --porcelain --untracked-files=no)"
          uv pip install --system -e '.[dev]' -e vendor/deer-flow/backend/packages/harness
      - name: Prepare digest-pinned offline Python test image
        run: |
          docker pull python:3.12-slim
          docker image inspect python:3.12-slim --format '{{index .RepoDigests 0}}'
      - name: Real adaptive Planner Explorer Coder Tester and optional Repair
        timeout-minutes: 23
        env:
          ASWE_LIVE_SMOKE: '1'
          ASWE_ADAPTIVE_LIVE_ONCE: '1'
          LLM_API_KEY: ${{ secrets.SWE_LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.SWE_LLM_MODEL }}
          LLM_BASE_URL: ${{ secrets.SWE_LLM_BASE_URL }}
          PYTHONPATH: src
          LANGCHAIN_TRACING_V2: 'false'
          LANGSMITH_TRACING: 'false'
          ASWE_ADAPTIVE_LIVE_REPORT_PATH: ${{ runner.temp }}/adaptive-live-summary.json
        run: |
          python scripts/live_adaptive_acceptance.py
      - name: Upload redacted Adaptive E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-live-e2e-summary
          path: ${{ runner.temp }}/adaptive-live-summary.json
          retention-days: 7
          if-no-files-found: ignore
