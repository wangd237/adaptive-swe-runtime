# TEMPORARY paid evaluation; restricted to exact branch+commit marker; delete after outcome.
name: Step 7D-D Real LLM Efficiency and Reliability A/B

on:
  push:
    branches: ['acceptance/step7dd-real-llm-validation']

permissions:
  contents: read

jobs:
  real-issues:
    if: >-
      github.ref == 'refs/heads/acceptance/step7dd-real-llm-validation' &&
      contains(github.event.head_commit.message, '[run-step7dd-paid-once]')
    strategy:
      fail-fast: false
      matrix:
        issue: ['524', '565']
    concurrency:
      group: aswe-step7dd-once-${{ matrix.issue }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: bytedance/deer-flow
          ref: c0895d295bba34f6e95188fca380f555dabed891
          path: vendor/deer-flow
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install frozen dependency and check upstream baseline
        run: |
          test "$(git -C vendor/deer-flow rev-parse HEAD)" = "c0895d295bba34f6e95188fca380f555dabed891"
          uv pip install --system -e '.[dev]' -e vendor/deer-flow/backend/packages/harness
          python -m compileall -q scripts/step7d_real_issue_eval.py
          python -c "import ast; from scripts.step7d_real_issue_eval import CASES; [ast.parse(item['tests']) for item in CASES.values()]"
      - name: Prepare isolated Docker image
        run: |
          docker pull python:3.12-slim
          docker image inspect python:3.12-slim --format '{{index .RepoDigests 0}}'
      - name: Genuine LLM coder DAG on public Issue
        timeout-minutes: 23
        env:
          GITHUB_ACTIONS: 'true'
          ASWE_LIVE_SMOKE: '1'
          ASWE_STEP7D_EVAL_ONCE: '1'
          ASWE_EVAL_CASE: ${{ matrix.issue }}
          PYTHONPATH: 'src:.'
          LLM_API_KEY: ${{ secrets.SWE_LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.SWE_LLM_MODEL }}
          LLM_BASE_URL: ${{ secrets.SWE_LLM_BASE_URL }}
          LANGCHAIN_TRACING_V2: 'false'
          LANGSMITH_TRACING: 'false'
          ASWE_STEP7D_EVAL_REPORT_PATH: ${{ runner.temp }}/step7d-issue-${{ matrix.issue }}.json
        run: python scripts/step7d_real_issue_eval.py
      - name: Upload redacted evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aswe-step7d-issue-${{ matrix.issue }}-evidence
          path: ${{ runner.temp }}/step7d-issue-${{ matrix.issue }}.json
          retention-days: 7
          if-no-files-found: error
