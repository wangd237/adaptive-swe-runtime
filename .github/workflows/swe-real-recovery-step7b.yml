# PAID controlled first-write fault -> genuine external LLM recovery.
# Manual authorization RUN is required. Never launch paid model jobs on push/PR.
name: SWE Step 7B Real LLM Recovery E2E

on:
  workflow_dispatch:
    inputs:
      authorization:
        description: "Type RUN to authorize a paid live recovery benchmark"
        required: true
        type: string
permissions:
  contents: read

concurrency:
  group: aswe-step7b-real-recovery
  cancel-in-progress: false

jobs:
  real-recovery:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.authorization == 'RUN' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: bytedance/deer-flow
          ref: c0895d295bba34f6e95188fca380f555dabed891
          path: vendor/deer-flow
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Verify frozen DeerFlow and install
        run: |
          test "$(git -C vendor/deer-flow rev-parse HEAD)" = "c0895d295bba34f6e95188fca380f555dabed891"
          test -z "$(git -C vendor/deer-flow status --porcelain --untracked-files=no)"
          uv pip install --system -e '.[dev]' -e vendor/deer-flow/backend/packages/harness
      - name: Prepare digest pinned no-network test image
        run: |
          docker pull python:3.12-slim
          docker image inspect python:3.12-slim --format '{{index .RepoDigests 0}}'
      - name: One injected native denial, then real model self-recovery
        timeout-minutes: 9
        env:
          GITHUB_ACTIONS: 'true'
          ASWE_LIVE_SMOKE: '1'
          ASWE_STEP7B_RECOVERY_ONCE: '1'
          PYTHONPATH: 'src:.'
          LLM_API_KEY: ${{ secrets.SWE_LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.SWE_LLM_MODEL }}
          LLM_BASE_URL: ${{ secrets.SWE_LLM_BASE_URL }}
          LANGCHAIN_TRACING_V2: 'false'
          LANGSMITH_TRACING: 'false'
          ASWE_STEP7B_RECOVERY_REPORT_PATH: ${{ runner.temp }}/step7b-recovery-result.json
        run: |
          python scripts/step7b_live_recovery.py
      - name: Upload redacted recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aswe-step7b-live-recovery-evidence
          path: ${{ runner.temp }}/step7b-recovery-result.json
          retention-days: 7
          if-no-files-found: error
